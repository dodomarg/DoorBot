# ---------------------------------------------------------------------------
# DoorBot - Seeed XIAO ESP32S3 + Seeed Bus Servo Driver Board + Feetech STS3215
#
# Wiring (the XIAO plugs straight into the driver board's headers):
#   XIAO D6 / GPIO43 -> servo bus TX
#   XIAO D7 / GPIO44 -> servo bus RX
#   Driver board DC IN: 5-12 V matching your servo (STS3215 12 V variant -> 12 V)
#   The XIAO is powered separately over USB-C.
#
# The servo bus runs at 1,000,000 baud, which is the STS3215 factory default.
# ---------------------------------------------------------------------------

substitutions:
  device_name: doorbot
  friendly_name: DoorBot

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(bolt)->set_torque_limit((uint16_t) id(torque_limit).state);

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# The keypad bridge's setup wizard and NimBLE stack want the XIAO's PSRAM.
psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [sts3215]
  # When running from GitHub instead, swap the block above for:
  # - source: github://dodomarg/DoorBot@main
  #   components: [sts3215]
  - source: github://pierluigizagaria/switchbot-keypad-bridge
    components: [switchbot_keypad_bridge]

logger:
  # The servo bus occupies GPIO43/44, which are UART0's default pins, so the
  # normal serial console is unavailable. The ESP32-S3 has a separate
  # USB-Serial/JTAG peripheral wired to the USB-C port, so logs still come out
  # over the same cable used for flashing, without disturbing the servo bus.
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret doorbot_api_key
  actions:
    - action: move_to
      variables:
        position: int
        speed: int
      then:
        - lambda: 'id(bolt)->move_to(position, speed);'
    - action: set_torque
      variables:
        enabled: bool
      then:
        - lambda: 'id(bolt)->set_torque(enabled);'
    - action: capture_position
      variables:
        which: string
      then:
        - lambda: |-
            const int pos = id(bolt)->position();
            if (pos < 0) return;
            if (which == "locked") {
              id(locked_position).publish_state(pos);
            } else if (which == "unlocked") {
              id(unlocked_position).publish_state(pos);
            }
    - action: home_to_stall
      variables:
        direction: int
        load_threshold: int
      then:
        - lambda: 'id(bolt)->home_to_stall(direction, load_threshold, 1200, 300);'

ota:
  - platform: esphome
    password: !secret doorbot_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# There is deliberately no fallback `ap:` here, and no captive_portal.
#
# An AP would be genuinely useless on this device. captive_portal cannot be
# used, because switchbot_keypad_bridge's own final_validate rejects the
# `web_server:` component outright ("both bind to port 80 and both define
# USE_WEBSERVER"), and captive_portal needs web_server_base. So the AP could
# not re-enter Wi-Fi credentials. It could not finish keypad pairing either:
# the setup wizard signs in against https://account.api.switchbot.net, and a
# client parked on the ESP's own AP has no route to the internet.
#
# improv_serial is the recovery path instead. Hold the board's BOOT button
# while plugging in, open https://web.esphome.io, and set new Wi-Fi
# credentials over the same USB cable used for flashing -- no reflash needed.
improv_serial:

# The setup wizard's HTTPS call to SwitchBot needs a valid system clock.
time:
  - platform: sntp
    id: sntp_time

# ---------------------------------------------------------------- servo bus
uart:
  id: servo_bus
  tx_pin: GPIO43   # XIAO D6
  rx_pin: GPIO44   # XIAO D7
  baud_rate: 1000000
  data_bits: 8
  parity: NONE
  stop_bits: 1

sts3215:
  id: bolt
  uart_id: servo_bus
  servo_id: 1
  update_interval: 1s
  position:
    name: "Position"
    id: servo_position
  load:
    name: "Load"
    id: servo_load
  voltage:
    name: "Servo voltage"
  temperature:
    name: "Servo temperature"
  moving:
    name: "Moving"
    id: servo_moving
  online:
    name: "Servo online"
    id: servo_online

# ------------------------------------------------------------- calibration
# These are plain template numbers with restore_value, so the calibration
# survives reboots and the lock keeps working even if the add-on is stopped.
number:
  - platform: template
    name: "Locked position"
    id: locked_position
    optimistic: true
    restore_value: true
    initial_value: 2048
    min_value: 0
    max_value: 4095
    step: 1
    mode: box
    entity_category: config

  - platform: template
    name: "Unlocked position"
    id: unlocked_position
    optimistic: true
    restore_value: true
    initial_value: 1024
    min_value: 0
    max_value: 4095
    step: 1
    mode: box
    entity_category: config

  - platform: template
    name: "Target position"
    id: target_position
    min_value: 0
    max_value: 4095
    step: 1
    mode: slider
    optimistic: true
    set_action:
      - lambda: 'id(bolt)->move_to((int) x);'

  - platform: template
    name: "Speed"
    id: move_speed
    optimistic: true
    restore_value: true
    initial_value: 800
    min_value: 50
    max_value: 4000
    step: 50
    mode: box
    entity_category: config

  - platform: template
    name: "Overshoot"
    id: overshoot
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 500
    step: 5
    mode: box
    entity_category: config

  - platform: template
    name: "Torque limit"
    id: torque_limit
    optimistic: true
    restore_value: true
    initial_value: 700
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    entity_category: config
    set_action:
      - lambda: 'id(bolt)->set_torque_limit((uint16_t) x);'

  - platform: template
    name: "Jam load threshold"
    id: stall_load
    optimistic: true
    restore_value: true
    initial_value: 850
    min_value: 100
    max_value: 1000
    step: 10
    mode: box
    entity_category: config

switch:
  - platform: template
    name: "Servo torque"
    id: servo_torque
    optimistic: true
    restore_mode: ALWAYS_ON
    entity_category: config
    turn_on_action:
      - lambda: 'id(bolt)->set_torque(true);'
    turn_off_action:
      - lambda: 'id(bolt)->set_torque(false);'

button:
  - platform: template
    name: "Capture locked position"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(bolt)->position() >= 0)
            id(locked_position).publish_state(id(bolt)->position());

  - platform: template
    name: "Capture unlocked position"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(bolt)->position() >= 0)
            id(unlocked_position).publish_state(id(bolt)->position());

  - platform: restart
    name: "Restart"

# ------------------------------------------------------------------- lock
lock:
  - platform: template
    name: "Lock"
    id: door_lock
    optimistic: false
    lambda: |-
      if (!id(servo_online).state || id(bolt)->position() < 0)
        return {};
      const int pos = id(bolt)->position();
      const int locked = (int) id(locked_position).state;
      const int unlocked = (int) id(unlocked_position).state;
      const int travel = abs(locked - unlocked);
      const int tolerance = std::max(25, travel * 15 / 100);
      if (abs(pos - locked) <= tolerance)
        return LOCK_STATE_LOCKED;
      if (abs(pos - unlocked) <= tolerance)
        return LOCK_STATE_UNLOCKED;
      return {};
    lock_action:
      - script.execute:
          id: travel_to
          target: !lambda 'return (int) id(locked_position).state;'
          away_from: !lambda 'return (int) id(unlocked_position).state;'
      - script.wait: travel_to
    unlock_action:
      - script.execute:
          id: travel_to
          target: !lambda 'return (int) id(unlocked_position).state;'
          away_from: !lambda 'return (int) id(locked_position).state;'
      - script.wait: travel_to
    open_action:
      - lock.unlock: door_lock

script:
  # Drives the bolt to `target`, optionally pushing a little past it first so a
  # stiff euro cylinder is fully thrown, then settling exactly on target.
  - id: travel_to
    mode: restart
    parameters:
      target: int
      away_from: int
    then:
      - lambda: |-
          const int push = (int) id(overshoot).state;
          const int speed = (int) id(move_speed).state;
          if (push > 0) {
            const int dir = target >= away_from ? 1 : -1;
            id(bolt)->move_to(target + dir * push, speed);
          } else {
            id(bolt)->move_to(target, speed);
          }
      - delay: 1200ms
      - lambda: 'id(bolt)->move_to(target, (int) id(move_speed).state);'
      - delay: 600ms
      - if:
          condition:
            lambda: 'return abs(id(bolt)->load()) >= (int) id(stall_load).state;'
          then:
            - logger.log:
                level: WARN
                format: "DoorBot may be jammed: load %d"
                args: ['id(bolt)->load()']
            - homeassistant.event:
                event: esphome.doorbot_jammed

# ------------------------------------------- SwitchBot Keypad (encrypted)
#
# The ESP32 impersonates a SwitchBot Lock over BLE. A genuine SwitchBot Keypad
# pairs to it and every credential arrives as an AES-CTR encrypted frame that
# says HOW it was presented (pin / nfc / fingerprint / face) and WHICH slot it
# came from -- so DoorBot knows who is at the door.
#
# Setup is a one-time on-device wizard: browse to the ESP32's IP, sign in to
# your SwitchBot account, pick the keypad. After that it is entirely local.
# No SwitchBot Lock is required.
#
# Note: this drives NimBLE directly and cannot coexist with esp32_ble_tracker.
switchbot_keypad_bridge:
  id: keypad
  keypad:
    name: "Keypad"
  keypad_action:
    name: "Keypad action"
  keypad_battery_level:
    name: "Keypad battery"
  reset_button:
    name: "Re-link keypad"
  on_unlock:
    - homeassistant.event:
        event: esphome.doorbot_keypad
        data:
          method: !lambda 'return method;'
          slot: !lambda 'return to_string(index);'
    - logger.log:
        format: "Keypad unlock: %s slot %d"
        args: ['method.c_str()', 'index']
    - lock.unlock: door_lock
  on_lock:
    - lock.lock: door_lock
  on_doorbell:
    - homeassistant.event:
        event: esphome.doorbot_doorbell

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    entity_category: diagnostic
    update_interval: 60s
