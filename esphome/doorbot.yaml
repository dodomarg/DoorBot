# ---------------------------------------------------------------------------
# DoorBot - Seeed XIAO ESP32S3 + Seeed Bus Servo Driver Board + Feetech servo
#
# Tested servo models: ST3215 and ST3235. They share the Feetech SMS/STS
# control table, a 4096-step encoder and a 1,000,000 baud default, so the same
# driver handles both. The ST3235 differs mechanically -- steel gears with a
# 1:345 reduction, and it reports current and temperature as well as position,
# load, speed and voltage.
#
# Wiring (the XIAO plugs straight into the driver board's headers):
#   XIAO D6 / GPIO43 -> servo bus TX
#   XIAO D7 / GPIO44 -> servo bus RX
#   Driver board DC IN: 5-12 V matching your servo (both models take 6-12.6 V,
#     so 12 V is the sensible choice for full torque)
#   The XIAO is powered separately over USB-C.
#
# The servo bus runs at 1,000,000 baud, which is the factory default for both.
# ---------------------------------------------------------------------------

substitutions:
  device_name: doorbot
  friendly_name: DoorBot

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(bolt)->set_torque_limit((uint16_t) id(torque_limit).state);

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# The keypad bridge's setup wizard and NimBLE stack want the XIAO's PSRAM.
psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [feetech_servo]
  # When running from GitHub instead, swap the block above for:
  # - source: github://dodomarg/DoorBot@main
  #   components: [feetech_servo]
  - source: github://pierluigizagaria/switchbot-keypad-bridge
    components: [switchbot_keypad_bridge]

logger:
  # The servo bus occupies GPIO43/44, which are UART0's default pins, so the
  # normal serial console is unavailable. The ESP32-S3 has a separate
  # USB-Serial/JTAG peripheral wired to the USB-C port, so logs still come out
  # over the same cable used for flashing, without disturbing the servo bus.
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret doorbot_api_key
  actions:
    # Closed loop: the move is verified, and "Last move" reports how it ended.
    - action: move_to
      variables:
        position: int
        speed: int
      then:
        - lambda: 'id(bolt)->start_move((int32_t) position, speed);'
    - action: stop
      then:
        - lambda: 'id(bolt)->abort_move();'
    - action: set_torque
      variables:
        enabled: bool
      then:
        - lambda: 'id(bolt)->set_torque(enabled);'
    - action: hold_open
      variables:
        seconds: int
      then:
        # A one-off override. Writing to the hold_seconds number instead would
        # permanently change the user's saved setting, since it is restored
        # from flash - a service call with seconds:0 would quietly disable
        # hold-open forever.
        - lambda: 'id(hold_override) = seconds;'
        - script.execute: open_door
    - action: capture_position
      variables:
        which: string
      then:
        - lambda: |-
            const int pos = id(bolt)->position();
            if (pos < 0) return;
            if (which == "locked") {
              id(locked_position).publish_state(pos);
            } else if (which == "unlocked") {
              id(unlocked_position).publish_state(pos);
            }
    - action: home_to_stall
      variables:
        direction: int
        load_threshold: int
      then:
        - lambda: 'id(bolt)->start_seek_stall(direction, load_threshold, 6000, 200);'
    # Servo programming, so none of this needs Feetech's Windows tool.
    - action: configure_servo
      variables:
        multi_turn: bool
        torque_limit: int
        max_torque: int
      then:
        - lambda: |-
            id(bolt)->apply_multi_turn(multi_turn);
            id(bolt)->set_torque_limit((uint16_t) torque_limit);
            id(bolt)->set_max_torque((uint16_t) max_torque);
    - action: recenter_servo
      then:
        - lambda: 'id(bolt)->recenter_here();'
    # Drive to a position and hold it under torque for a bounded window, for
    # doors whose outside handle does not retract the latch. The firmware
    # clamps the window and owns the deadline, so a caller that dies mid-hold
    # cannot leave the door clamped.
    - action: hold_open
      variables:
        position: int
        seconds: int
      then:
        - lambda: 'id(bolt)->start_hold_move((int32_t) position, (uint32_t) (seconds * 1000), (int) id(move_speed).state);'
    - action: end_hold
      then:
        - lambda: 'id(bolt)->end_hold();'

ota:
  - platform: esphome
    password: !secret doorbot_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # mDNS is link-local multicast to 224.0.0.251 and does not cross a router, so
  # `doorbot.local` will not resolve when the lock sits on an isolated IoT VLAN
  # and Home Assistant does not. Addressing the device directly keeps OTA and
  # the API working across subnets. Pair this with a DHCP reservation, or the
  # address will eventually move out from under it.
  use_address: !secret doorbot_address

# There is deliberately no fallback `ap:` here, and no captive_portal.
#
# An AP would be genuinely useless on this device. captive_portal cannot be
# used, because switchbot_keypad_bridge's own final_validate rejects the
# `web_server:` component outright ("both bind to port 80 and both define
# USE_WEBSERVER"), and captive_portal needs web_server_base. So the AP could
# not re-enter Wi-Fi credentials. It could not finish keypad pairing either:
# the setup wizard signs in against https://account.api.switchbot.net, and a
# client parked on the ESP's own AP has no route to the internet.
#
# improv_serial is the recovery path instead. Plug the board in normally (do
# not hold BOOT -- that enters the ROM bootloader, where the firmware, and so
# improv, is not running), then either use "Configure Wi-Fi" at
# https://web.esphome.io or run tools/improv_provision.py. Either way the
# credentials go into NVS over the USB cable, with no reflash.
#
# Note those credentials do not survive a factory flash, which erases NVS. Keep
# secrets.yaml correct as well, or the next cable flash reverts to whatever was
# compiled in.
improv_serial:

# The setup wizard's HTTPS call to SwitchBot needs a valid system clock.
time:
  - platform: sntp
    id: sntp_time

# ---------------------------------------------------------------- servo bus
uart:
  id: servo_bus
  tx_pin: GPIO43   # XIAO D6
  rx_pin: GPIO44   # XIAO D7
  baud_rate: 1000000
  data_bits: 8
  parity: NONE
  stop_bits: 1

feetech_servo:
  id: bolt
  uart_id: servo_bus
  servo_id: 1
  update_interval: 1s
  # Multi-turn absolute mode: with both angle limits set to 0 the goal register
  # accepts -30719..30719 instead of 0..4095, which is what a euro cylinder
  # needing two or three full turns requires.
  #
  # OFF by default, and that matters. Present_Position still wraps at 4096 no
  # matter what the goal register accepts, so a goal beyond one revolution can
  # never be *observed* as reached. Before the unwrap logic existed, that made
  # the servo chase a goal it could never see itself hit -- it ran away at the
  # configured speed instead of reporting a failure. The firmware now unwraps
  # the reading, but the revolution count still starts at zero on every boot,
  # so absolute multi-turn position does not survive a reset. Only turn this on
  # if your cylinder genuinely needs more than one revolution, and re-home after
  # a reboot when it does.
  multi_turn: false
  # A move only counts as finished once the servo is within this many steps of
  # the goal for two consecutive samples.
  tolerance: 25
  jam_load: 850
  move_timeout: 12s
  position:
    name: "Position"
    id: servo_position
  turns:
    name: "Turns"
    id: servo_turns
  load:
    name: "Load"
    id: servo_load
  current:
    name: "Servo current"
  voltage:
    name: "Servo voltage"
  temperature:
    name: "Servo temperature"
  moving:
    name: "Moving"
    id: servo_moving
  online:
    name: "Servo online"
    id: servo_online
  model:
    name: "Servo model"
  holding:
    name: "Holding position"
    id: servo_holding
  overload:
    name: "Servo overload"
    id: servo_overload
  move_result:
    name: "Last move"
    id: servo_move_result
  error:
    name: "Servo fault"
    id: servo_error

# ------------------------------------------------------------- calibration
# These are plain template numbers with restore_value, so the calibration
# survives reboots and the lock keeps working even if the add-on is stopped.
number:
  - platform: template
    name: "Locked position"
    id: locked_position
    optimistic: true
    restore_value: true
    initial_value: 2048
    min_value: -30719
    max_value: 30719
    step: 1
    mode: box
    entity_category: config

  - platform: template
    name: "Unlocked position"
    id: unlocked_position
    optimistic: true
    restore_value: true
    initial_value: 1024
    min_value: -30719
    max_value: 30719
    step: 1
    mode: box
    entity_category: config

  - platform: template
    name: "Target position"
    id: target_position
    min_value: -30719
    max_value: 30719
    step: 1
    mode: box
    optimistic: true
    set_action:
      - lambda: 'id(bolt)->start_move((int32_t) x, (int) id(move_speed).state);'

  - platform: template
    name: "Speed"
    id: move_speed
    optimistic: true
    restore_value: true
    initial_value: 800
    min_value: 50
    max_value: 3400
    step: 50
    mode: box
    entity_category: config

  - platform: template
    name: "Overshoot"
    id: overshoot
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 500
    step: 5
    mode: box
    entity_category: config

  - platform: template
    name: "Torque limit"
    id: torque_limit
    optimistic: true
    restore_value: true
    initial_value: 700
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    entity_category: config
    set_action:
      - lambda: 'id(bolt)->set_torque_limit((uint16_t) x);'

  - platform: template
    name: "Jam load threshold"
    id: stall_load
    optimistic: true
    restore_value: true
    initial_value: 850
    min_value: 100
    max_value: 1000
    step: 10
    mode: box
    entity_category: config

  # --- holding the latch open --------------------------------------------
  # On a door whose outside handle is passive, unlocking is not enough: the
  # latch has to be pulled back and kept back while somebody pushes the door.
  # These two settle how far past "unlocked" to turn, and for how long.
  - platform: template
    name: "Hold open position"
    id: hold_position
    optimistic: true
    restore_value: true
    initial_value: 1024
    min_value: -30719
    max_value: 30719
    step: 1
    mode: box
    entity_category: config

  - platform: template
    name: "Hold open seconds"
    id: hold_seconds
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 60
    step: 1
    mode: box
    unit_of_measurement: s
    entity_category: config

  # --- servo programming, all of it reachable from Home Assistant ---------
  # Every one of these writes the servo's own registers, so the servo never
  # has to be plugged into Feetech's Windows tool.
  - platform: template
    name: "Max torque"
    id: max_torque
    optimistic: true
    restore_value: true
    initial_value: 1000
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    entity_category: config
    set_action:
      - lambda: 'if (id(bolt)->online()) id(bolt)->set_max_torque((uint16_t) x);'

  - platform: template
    name: "Overload torque"
    id: overload_torque
    optimistic: true
    restore_value: true
    initial_value: 80
    min_value: 10
    max_value: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    entity_category: config
    set_action:
      - lambda: |-
          if (id(bolt)->online())
            id(bolt)->set_protection((uint8_t) x, (uint16_t) id(protection_time).state,
                                     (uint8_t) id(protective_torque).state);

  - platform: template
    name: "Protection time"
    id: protection_time
    optimistic: true
    restore_value: true
    initial_value: 2000
    min_value: 100
    max_value: 2540
    step: 10
    mode: box
    unit_of_measurement: ms
    entity_category: config
    set_action:
      - lambda: |-
          if (id(bolt)->online())
            id(bolt)->set_protection((uint8_t) id(overload_torque).state, (uint16_t) x,
                                     (uint8_t) id(protective_torque).state);

  - platform: template
    name: "Protective torque"
    id: protective_torque
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    entity_category: config
    set_action:
      - lambda: |-
          if (id(bolt)->online())
            id(bolt)->set_protection((uint8_t) id(overload_torque).state,
                                     (uint16_t) id(protection_time).state, (uint8_t) x);

  - platform: template
    name: "Servo ID"
    id: servo_id_number
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0
    max_value: 253
    step: 1
    mode: box
    entity_category: config

switch:
  # Not optimistic: the state shown is register 40 read back from the servo,
  # refreshed every update interval, so "on" means the servo confirmed it.
  - platform: template
    name: "Servo torque"
    id: servo_torque
    restore_mode: DISABLED
    entity_category: config
    lambda: |-
      if (!id(bolt)->online())
        return {};
      return id(bolt)->torque_on();
    turn_on_action:
      - lambda: 'id(bolt)->set_torque(true);'
    turn_off_action:
      - lambda: 'id(bolt)->set_torque(false);'

  # The servo drops to "Protective torque" if it exceeds "Overload torque" for
  # longer than "Protection time". That is what stops it cooking itself, but it
  # is also what makes it let go of a held latch. Turn this off only if you
  # understand that the servo will then happily stall until it burns out.
  - platform: template
    name: "Overload protection"
    id: overload_protection
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - lambda: 'if (id(bolt)->online()) id(bolt)->set_overload_protection_enabled(true);'
    turn_off_action:
      - lambda: 'if (id(bolt)->online()) id(bolt)->set_overload_protection_enabled(false);'

button:
  - platform: template
    name: "Capture locked position"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(bolt)->position() >= 0)
            id(locked_position).publish_state(id(bolt)->position());

  - platform: template
    name: "Capture unlocked position"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(bolt)->position() >= 0)
            id(unlocked_position).publish_state(id(bolt)->position());

  # Drive gently until the mechanism stops us, and record where that was. This
  # is the same idea as SwitchBot's calibration: let the door tell us its limits
  # instead of typing numbers in.
  - platform: template
    name: "Find locked end stop"
    entity_category: config
    on_press:
      - script.execute: seek_and_capture_locked

  - platform: template
    name: "Find unlocked end stop"
    entity_category: config
    on_press:
      - script.execute: seek_and_capture_unlocked

  - platform: template
    name: "Re-centre servo here"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(bolt)->recenter_here())
            ESP_LOGI("doorbot", "Servo re-centred; this position now reads 2048");

  - platform: template
    name: "Ping servo"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          const bool ok = id(bolt)->ping();
          ESP_LOGI("doorbot", "Servo %u %s", id(bolt)->servo_id(), ok ? "answered" : "did not answer");

  - platform: template
    name: "Apply servo ID"
    entity_category: config
    on_press:
      - lambda: |-
          const uint8_t wanted = (uint8_t) id(servo_id_number).state;
          if (id(bolt)->servo_id() != wanted)
            id(bolt)->change_servo_id(wanted);

  - platform: restart
    name: "Restart"

# ------------------------------------------------------------------- lock
lock:
  - platform: template
    name: "Lock"
    id: door_lock
    optimistic: false
    lambda: |-
      if (!id(servo_online).state || id(bolt)->position() < 0)
        return {};
      const int32_t pos = id(bolt)->position();
      const int32_t locked = (int32_t) id(locked_position).state;
      const int32_t unlocked = (int32_t) id(unlocked_position).state;
      const int32_t travel = abs(locked - unlocked);
      const int32_t tolerance = std::max((int32_t) 25, travel * 15 / 100);
      if (abs(pos - locked) <= tolerance)
        return LOCK_STATE_LOCKED;
      if (abs(pos - unlocked) <= tolerance)
        return LOCK_STATE_UNLOCKED;
      return {};
    lock_action:
      # Stop any hold in progress first, and end it in the firmware too. The
      # travel_to move would clear the hold anyway (start_move always does),
      # but dropping torque before commanding a new move is the order that
      # never leaves the bolt fighting a hold it no longer owns.
      - script.stop: open_door
      - lambda: 'id(bolt)->end_hold();'
      - script.execute:
          id: travel_to
          target: !lambda 'return (int32_t) id(locked_position).state;'
          away_from: !lambda 'return (int32_t) id(unlocked_position).state;'
      - script.wait: travel_to
    unlock_action:
      - script.stop: open_door
      - lambda: 'id(bolt)->end_hold();'
      - script.execute:
          id: travel_to
          target: !lambda 'return (int32_t) id(unlocked_position).state;'
          away_from: !lambda 'return (int32_t) id(locked_position).state;'
      - script.wait: travel_to
    # "Open" is more than "unlock" on a door with a passive outside handle: the
    # latch has to be held back while somebody pushes. See the open_door script.
    open_action:
      - script.execute: open_door
      - script.wait: open_door

globals:
  # One-off hold duration from the hold_open action. -1 means "use the saved
  # Hold open seconds"; it is consumed and reset by open_door.
  - id: hold_override
    type: int
    restore_value: false
    initial_value: '-1'
  # The duration the current hold is actually running for.
  - id: hold_active
    type: int
    restore_value: false
    initial_value: '0'

script:
  # Drives the bolt to `target`, optionally pushing a little past it first so a
  # stiff euro cylinder is fully thrown, then settling exactly on target.
  #
  # Every move here is closed loop: start_move() commands the servo and the
  # component then samples position and load every 25 ms until it either lands
  # within tolerance, stalls, or runs out of time. Nothing waits on a guessed
  # delay, and nothing assumes the servo did as it was told.
  - id: travel_to
    mode: restart
    parameters:
      target: int
      away_from: int
    then:
      - lambda: |-
          const int push = (int) id(overshoot).state;
          const int speed = (int) id(move_speed).state;
          int32_t first = target;
          if (push > 0) {
            const int dir = target >= away_from ? 1 : -1;
            first = target + dir * push;
          }
          id(bolt)->start_move(first, speed);
      - wait_until:
          condition:
            lambda: 'return !id(bolt)->move_busy();'
          timeout: 20s
      - if:
          condition:
            lambda: 'return !id(bolt)->last_move_ok();'
          then:
            - script.execute:
                id: report_failure
                stage: "travel"
      - if:
          condition:
            lambda: 'return ((int) id(overshoot).state) > 0;'
          then:
            # Settle back onto the exact target after the overshoot push. This
            # runs even when the push itself stalled - a stiff cylinder jamming
            # mid-overshoot is exactly the case where leaving the bolt parked
            # past the lock point would be worst.
            - lambda: 'id(bolt)->start_move(target, (int) id(move_speed).state);'
            - wait_until:
                condition:
                  lambda: 'return !id(bolt)->move_busy();'
                timeout: 20s
      # Confirm the move actually landed. It must NOT ask verify_holding()
      # here: since 0.2.4 every move releases torque on arrival, so "is it
      # holding?" is false by design after a normal move, and asking it would
      # log a warning on every single lock and unlock.
      - lambda: |-
          if (!id(bolt)->last_move_ok())
            ESP_LOGW("doorbot", "Servo did not reach %d (%s at %d)", (int) target,
                     esphome::feetech_servo::move_result_to_string(id(bolt)->move_result()),
                     (int) id(bolt)->position());

  # Unlock, then keep turning past the unlocked point to pull the latch back and
  # hold it there, so a door with no working outside handle can be pushed open.
  # Set "Hold open seconds" to 0 to skip this entirely.
  - id: open_door
    mode: restart
    then:
      - script.execute:
          id: travel_to
          target: !lambda 'return (int32_t) id(unlocked_position).state;'
          away_from: !lambda 'return (int32_t) id(locked_position).state;'
      - script.wait: travel_to
      - lambda: |-
          // A negative override means "no override"; use the saved setting.
          id(hold_active) = id(hold_override) >= 0 ? id(hold_override) : (int) id(hold_seconds).state;
          id(hold_override) = -1;
      - if:
          condition:
            lambda: 'return id(hold_active) > 0;'
          then:
            # Hand the hold to the firmware rather than driving there and
            # sitting in a YAML delay. A plain start_move() releases torque the
            # moment it arrives, so the old delay held nothing at all; and a
            # script-owned window would keep the door clamped if this script
            # died mid-hold. start_hold_move() clamps to the firmware ceiling
            # and releases on its own deadline no matter what happens up here.
            - lambda: |-
                ESP_LOGI("doorbot", "Holding the latch at %d for %d s",
                         (int) id(hold_position).state, id(hold_active));
                id(bolt)->start_hold_move((int32_t) id(hold_position).state,
                                          ((uint32_t) id(hold_active)) * 1000,
                                          (int) id(move_speed).state);
            - wait_until:
                condition:
                  lambda: 'return !id(bolt)->move_busy();'
                timeout: 20s
            - if:
                condition:
                  lambda: 'return !id(bolt)->last_move_ok();'
                then:
                  # The hold is only granted on arrival, so a failed move here
                  # means there is no hold to wait out.
                  - script.execute:
                      id: report_failure
                      stage: "hold"
                else:
                  - homeassistant.event:
                      event: esphome.doorbot_holding_open
                  # Wait out the firmware's window, watching for a slip.
                  # Overload protection cuts output to "Protective torque"
                  # after "Protection time", which is the usual cause. This
                  # loop always terminates: the firmware guarantees the hold
                  # ends within its ceiling even if nothing up here runs.
                  - while:
                      condition:
                        lambda: 'return id(bolt)->hold_active();'
                      then:
                        - delay: 1s
                        - if:
                            condition:
                              lambda: 'return id(bolt)->hold_active() && !id(bolt)->verify_holding();'
                            then:
                              - logger.log:
                                  level: WARN
                                  format: "The latch slipped during the hold (position %d, load %d)"
                                  args: ['(int) id(bolt)->position()', 'id(bolt)->load()']
                              - homeassistant.event:
                                  event: esphome.doorbot_hold_slipped
                              - lambda: 'id(bolt)->end_hold();'
            # Belt and braces: never leave this script with a hold running.
            - lambda: 'id(bolt)->end_hold();'
            # Return to the plain unlocked position so the latch can drop.
            - lambda: 'id(bolt)->start_move((int32_t) id(unlocked_position).state, (int) id(move_speed).state);'
            - wait_until:
                condition:
                  lambda: 'return !id(bolt)->move_busy();'
                timeout: 20s

  # One place that turns a failed move into a log line and a Home Assistant
  # event, so automations can react to a jam without polling.
  - id: report_failure
    parameters:
      stage: string
    then:
      - logger.log:
          level: WARN
          format: "DoorBot %s failed: %s at %d (goal %d, load %d)"
          args:
            - 'stage.c_str()'
            - 'esphome::feetech_servo::move_result_to_string(id(bolt)->move_result())'
            - '(int) id(bolt)->position()'
            - '(int) id(bolt)->goal()'
            - 'id(bolt)->load()'
      - homeassistant.event:
          event: esphome.doorbot_jammed
          data_template:
            stage: !lambda 'return stage;'
            result: !lambda 'return esphome::feetech_servo::move_result_to_string(id(bolt)->move_result());'
            position: !lambda 'return to_string(id(bolt)->position());'
            load: !lambda 'return to_string(id(bolt)->load());'

  # Calibration helpers: creep until the mechanism stops us, then remember it.
  - id: seek_and_capture_locked
    mode: restart
    then:
      - lambda: |-
          const int dir = ((int32_t) id(locked_position).state) >= ((int32_t) id(unlocked_position).state) ? 1 : -1;
          id(bolt)->start_seek_stall(dir, (int) id(stall_load).state, 6000, 200);
      - wait_until:
          condition:
            lambda: 'return !id(bolt)->move_busy();'
          timeout: 60s
      - if:
          condition:
            lambda: 'return id(bolt)->last_move_ok();'
          then:
            - lambda: 'id(locked_position).publish_state(id(bolt)->position());'
          else:
            - script.execute:
                id: report_failure
                stage: "locked end stop"

  - id: seek_and_capture_unlocked
    mode: restart
    then:
      - lambda: |-
          const int dir = ((int32_t) id(unlocked_position).state) >= ((int32_t) id(locked_position).state) ? 1 : -1;
          id(bolt)->start_seek_stall(dir, (int) id(stall_load).state, 6000, 200);
      - wait_until:
          condition:
            lambda: 'return !id(bolt)->move_busy();'
          timeout: 60s
      - if:
          condition:
            lambda: 'return id(bolt)->last_move_ok();'
          then:
            - lambda: 'id(unlocked_position).publish_state(id(bolt)->position());'
          else:
            - script.execute:
                id: report_failure
                stage: "unlocked end stop"

# ------------------------------------------- SwitchBot Keypad (encrypted)
#
# The ESP32 impersonates a SwitchBot Lock over BLE. A genuine SwitchBot Keypad
# pairs to it and every credential arrives as an AES-CTR encrypted frame that
# says HOW it was presented (pin / nfc / fingerprint / face) and WHICH slot it
# came from -- so DoorBot knows who is at the door.
#
# Setup is a one-time on-device wizard: browse to the ESP32's IP, sign in to
# your SwitchBot account, pick the keypad. After that it is entirely local.
# No SwitchBot Lock is required.
#
# Note: this drives NimBLE directly and cannot coexist with esp32_ble_tracker.
switchbot_keypad_bridge:
  id: keypad
  keypad:
    name: "Keypad"
  keypad_action:
    name: "Keypad action"
  keypad_battery_level:
    name: "Keypad battery"
  reset_button:
    name: "Re-link keypad"
  on_unlock:
    - homeassistant.event:
        event: esphome.doorbot_keypad
        data:
          method: !lambda 'return method;'
          slot: !lambda 'return to_string(index);'
    - logger.log:
        format: "Keypad unlock: %s slot %d"
        args: ['method.c_str()', 'index']
    - lock.unlock: door_lock
  on_lock:
    - lock.lock: door_lock
  on_doorbell:
    - homeassistant.event:
        event: esphome.doorbot_doorbell

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    entity_category: diagnostic
    update_interval: 60s
