name: DoorBot
version: "0.2.3"
slug: doorbot
description: Calibrate a DIY servo deadbolt and manage its PIN codes, from inside Home Assistant.
url: https://github.com/dodomarg/DoorBot
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:lock-smart
panel_title: DoorBot
hassio_api: true
homeassistant_api: true
map:
  - app_config:rw
options:
  backend: mock
  lock_entity: lock.doorbot_lock
  position_number_entity: number.doorbot_target_position
  position_sensor_entity: sensor.doorbot_position
  load_sensor_entity: sensor.doorbot_load
  torque_switch_entity: switch.doorbot_servo_torque
  moving_binary_sensor_entity: binary_sensor.doorbot_moving
  holding_binary_sensor_entity: binary_sensor.doorbot_holding_position
  move_result_entity: sensor.doorbot_last_move
  online_binary_sensor_entity: binary_sensor.doorbot_servo_online
  voltage_sensor_entity: sensor.doorbot_servo_voltage
  temperature_sensor_entity: sensor.doorbot_servo_temperature
  auto_lock_seconds: 0
  max_failed_attempts: 5
  lockout_seconds: 300
  log_level: info
schema:
  backend: list(mock|esphome)
  lock_entity: str?
  position_number_entity: str?
  position_sensor_entity: str?
  load_sensor_entity: str?
  torque_switch_entity: str?
  moving_binary_sensor_entity: str?
  holding_binary_sensor_entity: str?
  move_result_entity: str?
  online_binary_sensor_entity: str?
  voltage_sensor_entity: str?
  temperature_sensor_entity: str?
  auto_lock_seconds: int(0,3600)
  max_failed_attempts: int(0,50)
  lockout_seconds: int(0,86400)
  log_level: list(debug|info|warning|error)
