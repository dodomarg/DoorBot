name: DoorBot
version: "0.1.0"
slug: doorbot
description: Calibrate a DIY servo deadbolt and manage its PIN codes, from inside Home Assistant.
url: https://github.com/dodomarg/DoorBot
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:lock-smart
panel_title: DoorBot
hassio_api: true
homeassistant_api: true
map:
  - addon_config:rw
options:
  backend: mock
  lock_entity: lock.doorbot_lock
  position_number_entity: number.doorbot_target_position
  position_sensor_entity: sensor.doorbot_position
  load_sensor_entity: sensor.doorbot_load
  torque_switch_entity: switch.doorbot_servo_torque
  auto_lock_seconds: 0
  max_failed_attempts: 5
  lockout_seconds: 300
  log_level: info
schema:
  backend: list(mock|esphome)
  lock_entity: str?
  position_number_entity: str?
  position_sensor_entity: str?
  load_sensor_entity: str?
  torque_switch_entity: str?
  auto_lock_seconds: int(0,3600)
  max_failed_attempts: int(0,50)
  lockout_seconds: int(0,86400)
  log_level: list(debug|info|warning|error)
